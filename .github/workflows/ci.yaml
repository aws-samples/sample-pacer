name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the whole workflow: nothing here writes to the repo. No job
# pushes an image (the build step sets `push: false`), no job logs in to a
# registry, and none touches releases or issues — only `release.yaml` needs
# `packages: write`. Stated explicitly rather than inherited, because the default
# for a repository can be read-write for every token (checkov CKV2_GHA_1).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every `uses:` below is pinned to an immutable commit SHA, and the trailing
# comment names the EXACT release that SHA is (`# v4.4.0`, never a floating
# `# v4`) so a reader can map pin → release without cloning anything. An action
# tag is mutable: the owner can retarget `v4` at different code after you
# reviewed it, which is how CVE-2025-30066 (tj-actions/changed-files, March
# 2025) leaked secrets from ~23k repositories. A SHA cannot be retargeted.
#
# A pin must be the COMMIT, never the SHA of an annotated tag OBJECT. Both
# resolve at run time (codeload serves a tarball for either), so this fails
# silently in the only way that matters: `github.com/<repo>/commit/<tag-object>`
# returns 404 and the REST API returns 422, leaving a pin no reviewer and no
# scanner can resolve. Take the PEELED ref — `refs/tags/vX.Y.Z^{}` when it
# exists, otherwise `refs/tags/vX.Y.Z`.
#
# Auditing a fork needs no Dependabot, Renovate, or any tooling — one command
# per line answers "is this SHA really that release?":
#
#     git ls-remote https://github.com/actions/checkout \
#         refs/tags/v4.4.0 'refs/tags/v4.4.0^{}'
#
# `scripts/ci/verify-action-pins` runs exactly that over both workflow files,
# peels correctly, and exits non-zero on a mismatch, a vague comment, or a
# tag-object pin. Bumping a pin = read the release notes, then paste the new
# tag's peeled SHA and rewrite the comment to the new exact version.
# Rationale and the threat it answers: threat-model.md, M-019 / T-012.
jobs:
  # Decides whether the change touches anything the jobs below check. A change
  # that only edits documentation skips them.
  #
  # Not `paths-ignore`: `rust`, `helm` and `image` are required checks on `main`,
  # and a workflow that never starts leaves a required check "Expected" forever,
  # so a docs-only PR could not merge. A job skipped by its own `if:` reports as
  # passed instead.
  #
  # The jobs below run unless this job SUCCEEDED and said `code=false`. A job
  # skipped because a dependency failed also reports as passed, so gating on
  # `code == 'true'` would let a broken detector merge unchecked code; gating on
  # `!= 'false'` makes every failure here run the full set.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      operator: ${{ steps.diff.outputs.operator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          # The PR's base, or the previous tip of `main` on a push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Paths no job below reads: nothing compiles, templates or copies
          # Markdown into the image (the chart's templates cite docs/ as prose).
          DOC_PATHS: '^(docs/.*|.*\.md|LICENSE)$'
          # What the operator e2e exercises (ADR-0047): the operator, the chart it renders
          # and installs, the two images the kind cluster runs, the e2e scripts, this
          # workflow, and release.yaml (whose operator build this job reproduces). A
          # daemon-only change is not in here: the ring's daemons only have to boot and
          # pass readiness, which the rust and image jobs already cover.
          OPERATOR_PATHS: '^(crates/pacer-operator/.*|deploy/helm/pacer/.*|deploy/helm/pacer-operator/.*|Dockerfile|Dockerfile\.operator|Cargo\.lock|Cargo\.toml|scripts/e2e/.*|\.github/workflows/(ci|release)\.yaml)$'
        run: |
          set -euo pipefail
          code=true
          operator=true
          # An unknown base (a first push, a force-push) keeps the full set.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if ! grep -qvE "$DOC_PATHS" <<<"$changed"; then
              code=false
            fi
            if ! grep -qE "$OPERATOR_PATHS" <<<"$changed"; then
              operator=false
            fi
            printf 'changed:\n%s\n' "$changed"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "operator=$operator" | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The one exception to the exact-release rule above, and it cannot be
      # fixed: dtolnay/rust-toolchain publishes on moving BRANCHES (`stable`),
      # not version tags, so there is no release for this SHA to name and
      # nothing for Dependabot to compare it against.
      #
      # And the SHA pins LESS than it looks like it does. It freezes the
      # action's own code; it does NOT freeze Rust. The toolchain comes from the
      # `toolchain` input, which defaults to `stable` and is resolved on the
      # runner at job time — so this job compiles with whatever stable Rust
      # exists the day it runs, and `clippy -D warnings` can go red with no
      # commit to this repo behind it. That is not hypothetical: the 2026-08-24
      # run failed on two lints a new stable had just added
      # (`chunks_exact_to_as_chunks`, `result_large_err`), fixed afterwards in
      # 46c3fab1 / ffa93322 / be551235.
      #
      # Kept floating on purpose — a new lint is worth learning about here
      # rather than from a contributor's red PR — which makes this the one Rust
      # surface that drifts: `.devcontainer`'s `FROM rust:<v>` and the two
      # `ARG RUST_VERSION` pins are all exact. For a reproducible CI instead,
      # add `toolchain: 1.NN.N` below and bump it deliberately.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # branch `stable` as of 2026-08-18
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # Default features only. The `efa` feature links libibverbs/libfabric
        # (installed by the aws-efa-installer, absent on stock GitHub runners),
        # so `--all-features` is validated in the EFA build image / `make lint`,
        # not here.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # The operator's contract with the charts it renders and installs (ADR-0047 § 1):
      # render.rs runs the real pacer chart, rbac.rs the operator chart's RBAC. They are
      # #[ignore]d in a plain `cargo test` because they need helm, and they fail rather
      # than skip without it — so this step is where they are guaranteed to run.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: test (operator ↔ chart contract)
        run: cargo test -p pacer-operator --test render --test rbac -- --ignored

  helm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Installs helm `latest` (the action's default). That is Helm 4 today, matching the
      # GitLab `helm` job's `alpine/helm:4`, but the action takes only `latest` or an exact
      # version — it has no way to say "4.x" — so this is the one helm surface that will
      # follow upstream across a future major. If Helm 5 lands and this job goes red while
      # GitLab stays green, that asymmetry is why: pin `with: {version: v4.x.y}` here.
      #
      # Note the two unrelated fours: `# v4.3.1` is the version of the ACTION, which has
      # nothing to do with which Helm it installs. The action's own v5 exists and is not a
      # Helm-5 thing either.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: lint + template (pacer)
        run: |
          helm lint deploy/helm/pacer
          helm template pacer deploy/helm/pacer > /dev/null
          helm template pacer deploy/helm/pacer \
            --set karpenter.enabled=true \
            --set karpenter.zoneId=use1-az4 \
            --set karpenter.clusterName=ci \
            --set karpenter.role=ci-role \
            --set efa.enabled=true > /dev/null
      - name: lint + template (pacer-operator)
        # Both RBAC shapes: watchNamespace set renders a Role, empty a ClusterRole.
        run: |
          helm lint deploy/helm/pacer-operator
          helm template pacer-operator deploy/helm/pacer-operator \
            | grep -qx 'kind: ClusterRole'
          helm template pacer-operator deploy/helm/pacer-operator \
            --set watchNamespace=cache | grep -qx 'kind: Role'
      - name: package both charts as the release does
        # release.yaml's `chart` job: bare X.Y.Z version, full tag as appVersion. The
        # operator chart's appVersion is the operator image tag its Deployment pulls, so
        # check that, rendered from the packaged chart.
        run: |
          set -euo pipefail
          for chart in pacer pacer-operator; do
            helm package "deploy/helm/$chart" --destination /tmp/charts \
              --version 0.0.0-ci --app-version v0.0.0-ci
          done
          helm template op /tmp/charts/pacer-operator-0.0.0-ci.tgz |
            grep -qx '          image: "ghcr.io/aws-samples/sample-pacer/operator:v0.0.0-ci"'

  image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The operator image (ADR-0047) as a second STEP of this job, not a matrix leg: `image`
      # is a required check on `main` by that exact name, and a matrix renames it to
      # `image (<leg>)`, which would leave the required check waiting forever. Its own
      # cache scope, so the two builds' layers do not overwrite each other's entries.
      - name: build operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.operator
          push: false
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  # The operator end to end on a throwaway kind cluster (ADR-0047, #44): the same
  # scripts/e2e/operator-e2e.sh that has run on EKS, against a real API server, a real
  # DaemonSet controller and real EndpointSlices, with images built from this commit.
  # Unit and render tests cannot see what this does — the operator's first cluster run
  # crash-looped on a TLS panic that every one of them passed.
  #
  # Runs only when a path it exercises changed (OPERATOR_PATHS in `changes`), and is not a
  # required check: a job skipped by its own `if:` reports as passed, so a change that
  # never touches the operator does not pay ~15 minutes for it.
  operator-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.operator != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # kind v0.33.0, checked against the digest published with that release:
      # https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Same cache scopes the `image` job writes, read-only here: on a warm cache these two
      # builds are layer pulls, and this job never pushes its own layers over that job's.
      - name: build daemon image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: pacer:e2e
          cache-from: type=gha
      - name: build operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.operator
          load: true
          tags: pacer-operator:e2e
          cache-from: type=gha,scope=operator
      # The release stamps the pacer chart embedded in the operator image with its own
      # version (release.yaml, CHART_VERSION/CHART_APP_VERSION), because that chart's
      # appVersion is the daemon image tag every ring defaults to. Build it the way the
      # release does, with a version no real release has, and render a ring with the
      # image's OWN helm and chart: the daemon image must be that version, or a released
      # operator would create rings on some other release's daemon.
      - name: build operator image as the release does
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.operator
          load: true
          tags: pacer-operator:release-stamp
          build-args: |
            CHART_VERSION=0.0.0-ci
            CHART_APP_VERSION=v0.0.0-ci
          cache-from: type=gha,scope=operator
      - name: the embedded chart carries the release version
        run: |
          set -euo pipefail
          want='ghcr.io/aws-samples/sample-pacer:v0.0.0-ci'
          got=$(docker run --rm --entrypoint /usr/local/bin/helm pacer-operator:release-stamp \
                  template ring /opt/pacer/chart |
                sed -n 's/^ *image: "\(.*sample-pacer:.*\)"$/\1/p' | sort -u)
          echo "daemon image a ring would get: ${got:-<none>}"
          [ "$got" = "$want" ] || { echo "expected $want" >&2; exit 1; }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: operator e2e on kind
        run: scripts/e2e/operator-kind.sh
