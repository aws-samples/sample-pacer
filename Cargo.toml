[workspace]
resolver = "2"
members = [
    "crates/pacer-daemon",
    "crates/pacer-cache",
    "crates/pacer-ring",
    "crates/pacer-transport",
    "crates/pacer-proto",
    "crates/pacer-backend",
    "crates/pacer-client",
    "crates/pacer-operator",
]
# The EFA hardware spike (planning/09) links libefa via a git-pinned ibverbs and
# only builds on EFA hardware; it is its OWN workspace (spike/efa/Cargo.toml) so
# the CI runners — which have no libfabric/libefa — never try to build it.
# Listed here explicitly so `cargo` at the repo root ignores the directory and a
# future stray `cargo build` from spike/ can't accidentally treat the root as its
# workspace. See spike/efa/README.md.
#
# The GDS spike (planning/20, Track N) is likewise its own workspace: a throwaway
# NVMe→HBM probe that is Linux-only (O_DIRECT, /proc/driver/nvidia-fs) and pointless
# to build on a CI runner with no GPU. It links no GPU library (CUDA and cuFile are
# dlopen'ed), so unlike spike/efa it type-checks anywhere — but it is still rig code,
# not a workspace member.
#
# The allocator/io probe (spike/allocfault) is the same shape again: it reproduces
# foyer's read-buffer and io_uring submit patterns to price them off the daemon, so it
# links the daemon's allocator but nothing of the daemon, and it opts out of the
# workspace lints a probe would only fight. Listed here for the stray-`cargo`
# reason above rather than because CI would otherwise build it — nothing does.
# See spike/allocfault/README.md, which also records what has been settled since.
#
# The forward-proxy spike (spike/authz-forward, ADR-0041) is a throwaway hyper + s3s
# proxy that was run against real S3 to validate the requester-identity auth mode
# before any of it was written into the daemon. Same shape: rig code, its own
# workspace, nothing of the daemon linked.
exclude = [
    "spike/efa",
    "spike/gds",
    "spike/allocfault",
    "spike/authz-forward",
]

[workspace.package]
version = "0.1.0"
# Distributed as a container image + Helm chart, not on crates.io.
publish = false
edition = "2021"
license = "MIT-0"
repository = "https://github.com/aws-samples/sample-pacer"

# Deliberately loose semver ranges (Cargo's default resolution), not exact `=`
# pins: Cargo.lock is checked into this repo and is the actual reproducibility
# mechanism (`cargo build` and CI both use it unless `cargo update` is run
# explicitly), which is the standard Rust convention. Exact pins here would
# fight Cargo's own resolver for no reproducibility gain and make routine
# patch-level bumps (security fixes included) needlessly manual.
[workspace.dependencies]
pacer-cache = { path = "crates/pacer-cache" }
pacer-ring = { path = "crates/pacer-ring" }
pacer-transport = { path = "crates/pacer-transport" }
pacer-proto = { path = "crates/pacer-proto" }
pacer-backend = { path = "crates/pacer-backend" }
pacer-client = { path = "crates/pacer-client" }

s3s = "0.14"
s3s-aws = "0.14"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
# 0.22.6 is a FLOOR, not a preference: it is the first release carrying
# `PieceRef` in both preludes (foyer#1330), and `Engine::enqueue` names that type
# — so on 0.22.5 or earlier `store_engine.rs` does not compile at all. Caret, so
# patch bumps are still free.
foyer = { version = "0.22.6", features = ["serde"] }
mixtrics = "0.2"
prometheus = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
# Requester mode's byte-transparent forward (ADR-0041 § 2.2): the client
# signed for the real S3 host, so the daemon must reach it over real TLS
# rather than terminate it. `native-roots` reads the container image's system CA
# bundle — the same one the AWS SDK's own HTTPS client already loads through
# rustls-native-certs, so there is no new store to provision.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "native-tokio",
    "aws-lc-rs",
] }
# Requester mode's TLS listener (ADR-0041 § 9) and an EXPLICIT crypto provider for it and
# for the forwarder above: rustls' process-default provider is ambiguous — and a startup
# panic — the moment any dependency also enables its `ring` backend. Both already in the
# tree through the AWS SDK and hyper-rustls; listed here only to name the provider.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
protoc-bin-vendored = "3"
bytes = "1"
# `mmap`/`munmap` for the EFA arena's own hugepage mapping (ADR-0024) and for
# mapping a client's shared-memory segment (ADR-0026). The `efa` feature of
# pacer-transport and pacer-daemon's delivery path pull it in.
libc = "0.2"
# CRC32 (IEEE) over bytes delivered into client memory (ADR-0026 point 5). Kept
# to the same flavour the S3 SDKs checksum bodies with, so a client shim can
# re-verify from any language's standard library.
crc32fast = "1"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# `json` is not decoration: the daemon's default log encoding is one JSON object
# per line (ADR-0036), because its logs are read out of `kubectl logs` by tooling
# far more often than by a person. `text` remains selectable at runtime, so both
# formatters have to be compiled in.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# The disk tier's on-disk format (ADR-0028, pacer-cache's `codec`). Pinned to the
# SAME major foyer's own `Code` blanket impl used, because that format is what a
# cache directory written by a previous build contains and the hand-written codec
# has to keep reading it — and because `foyer::Error::bincode_error` takes a
# `bincode::Error`, which is only the same type across one major.
bincode = "1"
# YAML config file (ADR-0013). serde_yaml (dtolnay) is archived; serde_yaml_ng
# is the maintained API-compatible fork.
serde_yaml_ng = "0.10"
# Property-based testing (T5): neither proptest nor quickcheck was in the
# dependency graph before this, so this is a fresh choice — proptest, for its
# shrinking (a failing case reduces to a minimal repro) and its `Strategy`
# combinators, which compose the bounded generators the range/chunk/codec
# properties need more directly than quickcheck's `Arbitrary`. Dev-only: no
# crate ships it in a non-test build.
proptest = "1"
# Table-driven test cases (T2). The daemon's integration suite had two arms whose
# tests differed only by a parameter — a backend shape, a commit prefix — and both
# expressed that with a hand-rolled `macro_rules!` that generated one
# `#[tokio::test]` per value. rstest replaces the macro with named cases, so a
# failure says which value failed instead of which expansion did, and adding a value
# is one line rather than an edit to a macro. Chosen over `test-case` for its
# `#[case::name(..)]` labels and its first-class async support (the whole suite is
# `#[tokio::test]`). Dev-only: no crate ships it in a non-test build.
rstest = { version = "0.23", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# Workspace-wide lint policy (see CLAUDE.md "Coding style"). Every crate opts
# in via `[lints] workspace = true`; CI runs clippy with -D warnings, so a
# warn here is a merge blocker.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
unreadable_literal = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
