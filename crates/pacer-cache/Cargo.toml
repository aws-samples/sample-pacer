[package]
name = "pacer-cache"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cache policy, the registered RAM slab, and both disk tiers: the O_DIRECT chunk store and foyer"

[dependencies]
foyer.workspace = true
# Direct dep for ONE symbol, and only because of an upstream gap: `Engine::load` returns
# `Load::Entry { populated: Populated { .. } }`, and `Populated` is in `foyer-storage`'s
# prelude but NOT in `foyer`'s, which re-exports item by item and has no public
# `foyer::storage` path (its `lib.rs` is `pub use prelude::*` alone). That is the same
# "public trait, not implementable downstream" gap foyer#1330 closed for `PieceRef`, one
# symbol further along; a follow-up one-liner upstream deletes this line. Version tracks
# the workspace's `foyer` floor so exactly one `foyer-storage` is in the graph — two would
# make our `Engine` impl a different trait from the one `StoreBuilder` accepts.
foyer-storage = "0.22.6"
# `Engine`'s methods return `BoxFuture`. foyer-storage exposes it from `futures-core`, so
# this matches rather than pulling the whole `futures` facade in for one type alias.
futures-core = "0.3"
mixtrics.workspace = true
bytes = { workspace = true, features = ["serde"] }
crc32fast.workspace = true
# O_DIRECT: the read path DMAs from NVMe straight into a registered hugepage frame,
# and the flag has no portable spelling in std.
libc = "0.2"
serde.workspace = true
bincode.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
proptest.workspace = true

[lints]
workspace = true
