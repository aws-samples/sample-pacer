[package]
name = "pacer-ring"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cluster membership + rendezvous hashing for cache-key ownership"

[features]
default = []
# Kubernetes EndpointSlice membership watch (production). Off by default so
# tests and tools don't drag the kube stack in.
k8s = ["dep:kube", "dep:k8s-openapi", "dep:futures", "dep:anyhow", "dep:tracing"]

[dependencies]
serde.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }

kube = { version = "4", default-features = false, features = ["client", "runtime", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_33"], optional = true }
futures = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Only the `seed`/`fetch` benchmark examples need the S3 stack; as
# dev-dependencies they never touch the lib build downstream consumers get,
# only `cargo build --examples`/`cargo test`.
[dev-dependencies]
aws-sdk-s3 = { workspace = true }
# fetch.rs's bypass (direct-to-Express) arm resolves credentials through the
# default provider chain (EKS Pod Identity → S3 Express CreateSession); the
# static-creds daemon arm does not need it, but the loader lives here.
aws-config = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_json = "1"
# seed.rs's `--payload-signing streaming` builds a body the SDK cannot read up front, so
# that it takes SigV4's chunk-signed streaming shape: `StreamBody` frames of `Bytes` and
# hyper's re-export of `http_body::Frame`. Both already in the graph; dev-only.
http-body-util = { workspace = true }
hyper = { workspace = true }

[lints]
workspace = true
