apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacer-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacer-operator.labels" . | nindent 4 }}
spec:
  # A single replica with no leader election (ADR-0047 § 6): Recreate, not RollingUpdate,
  # so an upgrade never runs two replicas both applying at once, even briefly.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pacer-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacer-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacer-operator.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PACER_OPERATOR_WATCH_NAMESPACE
              value: {{ .Values.watchNamespace | quote }}
            # tracing-subscriber's EnvFilter logs ERRORS ONLY when RUST_LOG is unset, so without
            # this the operator is silent about every reconcile it does.
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          # `helm template` of a local chart writes nothing (Dockerfile.operator records how
          # that was checked), so a read-only root needs no writable volume.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
