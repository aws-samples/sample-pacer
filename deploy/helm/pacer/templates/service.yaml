apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pacer.labels" . | nindent 4 }}
spec:
  # Hard node-locality (GA in 1.26): kube-proxy routes only to endpoints on the
  # requesting pod's node, so every client talks to its local daemon and cache.
  internalTrafficPolicy: {{ .Values.service.internalTrafficPolicy }}
  selector:
    {{- include "pacer.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.ports.s3 }}
      targetPort: s3
    - name: admin
      port: {{ .Values.ports.admin }}
      targetPort: admin
