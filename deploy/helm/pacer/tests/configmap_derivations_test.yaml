# Derived ConfigMap values — the ones whose default is a DATA-LOSS bug rather than a
# preference.
#
# `pacer.submitQueueThreshold` bounds foyer's in-flight DRAM->NVMe writes, and foyer's OWN
# default is 16 MiB — exactly ONE entry at the shipped chunk size. An enqueue past the budget
# is SILENTLY DROPPED (foyer counts `foyer_storage_inner_op_total{op="channel_overflow"}`,
# the chunk never reaches disk, and a later read misses to a peer or the backend). Sizing it
# took the drop count from 4229 and 2244 to exactly 0, twice
# (bench/ladder/results/c4-foyer-readpath.md). A regression to foyer's default would read as
# "slightly fewer disk hits", which is why it is asserted rather than trusted.
#
# THE DERIVATION: `flushers x chunkSize x depth`, depth = 4 because that is the reader
# look-ahead knee the C4 ladder found (bench/ladder/results/c4-fanout-depth.md: depth 4 is
# where delivery peaks, depth 8 buys +5.4 % for double the queue). `flushers` floors at
# foyer's own 1 when unset, never 0 — a threshold of 0 means "foyer's default" TO THE DAEMON,
# i.e. the bug this helper closes.
#
# CHART DEFAULTS: config.tuning.flushers 32, config.chunkSize unset (16MiB).
#   32 x 16MiB x 4 = 2147483648   (2 GiB, the shipped default)
#   32 x 64MiB x 4 = 8589934592   (8 GiB, tracking chunkSize)
#
# These two cases replace the equivalent grep assertions that used to live in the CI `helm`
# job: same arithmetic, but a failure names the expected and actual value instead of printing
# `grep -q` exit 1. The remaining grep assertions in that job cover the OPT-IN negatives
# (a key that must be ABSENT from the default render), which a rendered-value comparison
# cannot express as directly.
suite: derived ConfigMap values
templates:
  - configmap.yaml
tests:
  - it: "the submit-queue threshold is DERIVED as flushers x chunkSize x 4 (2 GiB default)"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'submit-queue-threshold: "2147483648"'

  - it: "and it tracks chunkSize: 32 x 64MiB x 4 = 8 GiB"
    # Raising chunkSize cannot silently re-create the drops. A 64 MiB chunk against foyer's
    # own 16 MiB default would be 4x past the whole budget.
    set: { config.chunkSize: 64MiB }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'submit-queue-threshold: "8589934592"'

  - it: "and it tracks flushers: 8 x 16MiB x 4 = 512 MiB"
    set: { config.tuning.flushers: 8 }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'submit-queue-threshold: "536870912"'

  - it: "0 still buys foyer's own 16 MiB, for a control arm"
    # Helm coerces `--set ...=0` to the integer 0, which Go templates call falsey, so a bare
    # `if` in the helper would re-derive the budget and take the control arm away.
    set: { config.tuning.submitQueueThreshold: 0 }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'submit-queue-threshold: "0"'

  - it: "an explicit value wins over the derivation"
    set: { config.tuning.submitQueueThreshold: 4Gi }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'submit-queue-threshold: "4Gi"'

  - it: "the scatter staging budget is emitted EXPLICITLY, so budget and enforcement match"
    # pacer.memoryLimit had to budget for a specific number; emitting it is how the daemon is
    # held to the same one. 2Gi = 2147483648 restates DEFAULT_STAGING_BYTES.
    set: { scatter.enabled: true, config.backendType: standard }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'staging-bytes: "2147483648"'

  - it: "scatter.enabled=false is emitted explicitly, so the daemon's own default cannot win"
    # The daemon applies the SAME backend-scoped default when the file says nothing, so an
    # omitted block on a Standard backend would turn the scatter back on and overrule the
    # operator.
    set: { scatter.enabled: false, config.backendType: standard }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'scatter:\n\s+enabled: false'

  - it: "Express with the knob unset emits NO scatter block at all"
    # The one combination that must render a byte-identical ConfigMap to every pre-ADR-0032
    # Express release, so its pods do not roll for a default that does not apply to them.
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'scatter:'

  - it: "the HTTP/2 windows are ABSENT by default, so hyper's own values still apply"
    # The control arm for the StoreChunk flow-control question. Absent and 0 are not the same
    # thing here and the difference is not subtle: a 0 window is a legal HTTP/2 setting
    # meaning "send nothing", so a key that rendered empty-as-zero would deadlock the peer
    # plane on its first RPC instead of falling back to a default.
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'h2-stream-window'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'h2-connection-window'

  - it: "the store read ceiling and read shape are ABSENT by default"
    # Both are opt-in from the CHART's side and defaulted in the DAEMON, which is the split
    # that matters: the ceiling's value is a hardware measurement (16, the knee) and it lives
    # in one place — `pacer_cache::store::DEFAULT_READ_CONCURRENCY` — rather than being
    # retyped here where the two could drift. A key rendered empty would reach the daemon as
    # "0", which it reads as "use the default" and not as "unlimited", so this is a
    # correctness assertion and not a tidiness one.
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'store-read-concurrency'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'store-read-shape'

  - it: "and both render when set, including `unlimited` as a WORD not a zero"
    # `unlimited` has to survive as text. 0 already means "the default" on every numeric knob
    # here, so an operator who meant to restore the pre-ceiling behaviour and wrote 0 would
    # get the ceiling instead — which is why the uncap is spelled.
    set:
      config.storeReadConcurrency: unlimited
      config.storeReadShape: overlap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'store-read-concurrency: "unlimited"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'store-read-shape: "overlap"'

  - it: "and both render as quoted byte sizes when set"
    set: { cluster.h2StreamWindow: 16MiB, cluster.h2ConnectionWindow: 64MiB }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'h2-stream-window: "16MiB"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'h2-connection-window: "64MiB"'

  - it: "the peer pool width is absent by default and renders as a bare count when set"
    # Absent must mean "the daemon's own 1", not "0": a rendered zero would reach the
    # daemon as a refusal at startup, and a quoted one would fail the count parse.
    set: { cluster.peerConnections: 8 }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'peer-connections: 8'

  - it: "and no peer-connections key at all when it is left empty"
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'peer-connections:'

  - it: "hugepageSizeMib 1024 reaches the daemon as 1024, not as the 2 the default hardcoded"
    # The pod resource name and this line are two spellings of ONE decision, and the failure
    # when they disagree is silent rather than loud: the pod would hold a 1 GiB reservation
    # while `ArenaPages::from_mib` mapped the arenas on 4 KiB pages. The DaemonSet half of the
    # pair is asserted in `memory_limit_test.yaml`; this is the ConfigMap half.
    set: { efa.enabled: true, efa.hugepages: 18Gi, efa.hugepageSizeMib: 1024 }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rdma-arena-page-mib: 1024'

  - it: "hugepages tell the daemon to map its arenas from the same pool"
    # Derived from efa.hugepages rather than being its own knob: an arena mapping a size the
    # pod never requested fails ENOMEM and would degrade to 4 KiB pages, silently wasting the
    # reservation.
    set: { efa.enabled: true, efa.hugepages: 13Gi }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rdma-arena-page-mib: 2'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'cache-slab-bytes: "5368709120"'

  # ---- pacer.diskTier: the store is the default WHERE A SLAB EXISTS (ADR-0038) ----------
  #
  # The condition is not a preference. The store's read is O_DIRECT into a registered frame;
  # a heap Vec is not page-aligned, so with no slab every hit silently takes the BUFFERED
  # descriptor (26.9-34.9 ms per 16 MiB against 17.3) and the daemon REFUSES to start rather
  # than serve that. So an unscoped `store` default would make the chart's own defaults —
  # efa.enabled: false — fail to boot, which is `scatter.enabled`'s bare `true` again.
  - it: "with no slab (the chart's own defaults) the tier is foyer, which is what is measured there"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "foyer"'

  - it: "hugepages derive a slab, so the SAME values also flip the tier to store"
    # One `set`, two consequences, asserted together on purpose: the slab and the tier must
    # never be able to disagree about whether this node can do a direct read.
    set: { efa.enabled: true, efa.hugepages: 13Gi }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'cache-slab-bytes: "5368709120"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "store"'

  - it: "efa.enabled WITHOUT hugepages derives no slab, so the tier stays foyer"
    # The slab's gate is hugepages, not efa.enabled (pacer.cacheSlabBytes says why: a 132 GiB
    # slab on 32 rails is ~300 s of registration on 4 KiB pages, which CrashLoops the pod).
    # The tier has to follow the SLAB, not the feature.
    set: { efa.enabled: true }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "foyer"'

  - it: "an explicit cacheSlabBytes=0 — the documented no-slab hatch — takes the tier with it"
    # "0" is a non-empty string, and Go templates call it truthy: a bare `if` on the derived
    # slab would render `store` on a node that has no slab and the daemon would refuse to
    # start. The helper compares as an integer for exactly this case.
    set: { efa.enabled: true, efa.hugepages: 13Gi, cluster.cacheSlabBytes: 0 }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "foyer"'

  - it: "an operator always wins: foyer stays selectable on a node that HAS a slab"
    # The regression path ADR-0033 promised — one flag back — has to survive the flip.
    set: { efa.enabled: true, efa.hugepages: 13Gi, config.diskTier: foyer }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "foyer"'

  - it: "…and store stays selectable where the chart would not have defaulted it on"
    # Refused by the daemon at startup, deliberately — but the chart must still RENDER what
    # was asked for, so the refusal comes with the daemon's reason rather than the chart
    # quietly substituting a tier the operator did not choose.
    set: { config.diskTier: store }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "store"'

  - it: "the key is ALWAYS rendered, so the tier is never left to the daemon's own default"
    # It used to render only `with .Values.config.diskTier`, so the shipped chart emitted no
    # key at all and the tier was whatever config.rs defaulted to. A reader of the ConfigMap
    # could not tell which tier the node was running.
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'disk-tier: "(foyer|store)"'

  # ---- ADR-0039: the conditional-GET knob renders only when turned OFF -------------------
  #
  # `true` is the daemon's own default, so emitting it would be a second spelling of one
  # thing — and the shipped chart must not carry a key whose value the daemon already holds.
  - it: "the default renders NO conditional-get key, because the daemon's default is the same"
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'conditional-get-from-cache'

  - it: "turning it off renders it, since that is the only value worth transmitting"
    # The escape hatch for strict conditional semantics has to actually reach the daemon.
    set: { config.conditionalGetFromCache: false }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'conditional-get-from-cache: false'
