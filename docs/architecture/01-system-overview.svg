<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F8624"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#232F3E">

    <!-- Title -->
    <text x="40" y="58" font-size="34" font-weight="bold">PACER: a node-local S3 cache for EKS</text>
    <text x="40" y="92" font-size="18" fill="#545B64">One daemon per node. Unmodified S3 clients talk to their own node; nodes serve each other over EFA RDMA; S3 is read once.</text>

    <!-- Region / AZ -->
    <rect x="30" y="118" width="1540" height="765" rx="10" fill="none" stroke="#147EBA" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="48" y="144" font-size="16" font-weight="bold" fill="#147EBA">AWS Region · one Availability Zone (nodepool AZ ID = bucket AZ ID)</text>

    <!-- EKS cluster -->
    <rect x="60" y="160" width="1130" height="705" rx="10" fill="#F7F9FA" stroke="#ED7100" stroke-width="2"/>
    <text x="78" y="188" font-size="17" font-weight="bold" fill="#ED7100">Amazon EKS cluster · cache nodepool (Nitro v4+, instance-store NVMe, EFA)</text>

    <!-- ===== Node template x3 ===== -->
    <!-- Node 1 -->
    <g>
      <rect x="90" y="205" width="340" height="575" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.5"/>
      <text x="106" y="231" font-size="15" font-weight="bold" fill="#545B64">Node 1 (e.g. p5 / p6-b200)</text>
      <rect x="110" y="245" width="300" height="78" rx="6" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
      <text x="260" y="276" font-size="17" font-weight="bold" text-anchor="middle">Workload pod</text>
      <text x="260" y="302" font-size="14" text-anchor="middle" fill="#545B64">PyTorch · vLLM · boto3 · s5cmd · CLI</text>
      <line x1="260" y1="323" x2="260" y2="383" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
      <text x="272" y="358" font-size="13" fill="#545B64">S3 API over HTTP, :9000</text>
      <rect x="110" y="385" width="300" height="320" rx="8" fill="#FFF4E5" stroke="#ED7100" stroke-width="2"/>
      <text x="260" y="412" font-size="18" font-weight="bold" text-anchor="middle">pacer-daemon</text>
      <text x="260" y="432" font-size="13" text-anchor="middle" fill="#545B64">DaemonSet pod · Rust</text>
      <rect x="125" y="445" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="473" font-size="14" text-anchor="middle">S3 front end · re-signs requests</text>
      <rect x="125" y="497" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="525" font-size="14" text-anchor="middle">RAM tier · hugepage slab</text>
      <rect x="125" y="549" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="577" font-size="14" text-anchor="middle">Disk tier · NVMe chunk store</text>
      <rect x="125" y="601" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="629" font-size="14" text-anchor="middle">Hash ring + directory shard</text>
      <rect x="125" y="653" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#8C4FFF"/>
      <text x="260" y="681" font-size="14" text-anchor="middle">Peer transport · RDMA / gRPC</text>
      <rect x="110" y="718" width="140" height="46" rx="5" fill="#EEEEEE" stroke="#879196"/>
      <text x="180" y="747" font-size="14" text-anchor="middle">NVMe (RAID0)</text>
      <rect x="270" y="718" width="140" height="46" rx="5" fill="#F1EAFF" stroke="#8C4FFF" stroke-width="1.5"/>
      <text x="340" y="747" font-size="14" text-anchor="middle">EFA NICs</text>
    </g>
    <!-- Node 2 -->
    <g transform="translate(365,0)">
      <rect x="90" y="205" width="340" height="575" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.5"/>
      <text x="106" y="231" font-size="15" font-weight="bold" fill="#545B64">Node 2</text>
      <rect x="110" y="245" width="300" height="78" rx="6" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
      <text x="260" y="276" font-size="17" font-weight="bold" text-anchor="middle">Workload pod</text>
      <text x="260" y="302" font-size="14" text-anchor="middle" fill="#545B64">PyTorch · vLLM · boto3 · s5cmd · CLI</text>
      <line x1="260" y1="323" x2="260" y2="383" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
      <text x="272" y="358" font-size="13" fill="#545B64">S3 API over HTTP, :9000</text>
      <rect x="110" y="385" width="300" height="320" rx="8" fill="#FFF4E5" stroke="#ED7100" stroke-width="2"/>
      <text x="260" y="412" font-size="18" font-weight="bold" text-anchor="middle">pacer-daemon</text>
      <text x="260" y="432" font-size="13" text-anchor="middle" fill="#545B64">DaemonSet pod · Rust</text>
      <rect x="125" y="445" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="473" font-size="14" text-anchor="middle">S3 front end · re-signs requests</text>
      <rect x="125" y="497" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="525" font-size="14" text-anchor="middle">RAM tier · hugepage slab</text>
      <rect x="125" y="549" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="577" font-size="14" text-anchor="middle">Disk tier · NVMe chunk store</text>
      <rect x="125" y="601" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="629" font-size="14" text-anchor="middle">Hash ring + directory shard</text>
      <rect x="125" y="653" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#8C4FFF"/>
      <text x="260" y="681" font-size="14" text-anchor="middle">Peer transport · RDMA / gRPC</text>
      <rect x="110" y="718" width="140" height="46" rx="5" fill="#EEEEEE" stroke="#879196"/>
      <text x="180" y="747" font-size="14" text-anchor="middle">NVMe (RAID0)</text>
      <rect x="270" y="718" width="140" height="46" rx="5" fill="#F1EAFF" stroke="#8C4FFF" stroke-width="1.5"/>
      <text x="340" y="747" font-size="14" text-anchor="middle">EFA NICs</text>
    </g>
    <!-- Node N -->
    <g transform="translate(730,0)">
      <rect x="90" y="205" width="340" height="575" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.5"/>
      <text x="106" y="231" font-size="15" font-weight="bold" fill="#545B64">Node N</text>
      <rect x="110" y="245" width="300" height="78" rx="6" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
      <text x="260" y="276" font-size="17" font-weight="bold" text-anchor="middle">Workload pod</text>
      <text x="260" y="302" font-size="14" text-anchor="middle" fill="#545B64">PyTorch · vLLM · boto3 · s5cmd · CLI</text>
      <line x1="260" y1="323" x2="260" y2="383" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
      <text x="272" y="358" font-size="13" fill="#545B64">S3 API over HTTP, :9000</text>
      <rect x="110" y="385" width="300" height="320" rx="8" fill="#FFF4E5" stroke="#ED7100" stroke-width="2"/>
      <text x="260" y="412" font-size="18" font-weight="bold" text-anchor="middle">pacer-daemon</text>
      <text x="260" y="432" font-size="13" text-anchor="middle" fill="#545B64">DaemonSet pod · Rust</text>
      <rect x="125" y="445" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="473" font-size="14" text-anchor="middle">S3 front end · re-signs requests</text>
      <rect x="125" y="497" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="525" font-size="14" text-anchor="middle">RAM tier · hugepage slab</text>
      <rect x="125" y="549" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="577" font-size="14" text-anchor="middle">Disk tier · NVMe chunk store</text>
      <rect x="125" y="601" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#ED7100"/>
      <text x="260" y="629" font-size="14" text-anchor="middle">Hash ring + directory shard</text>
      <rect x="125" y="653" width="270" height="44" rx="5" fill="#FFFFFF" stroke="#8C4FFF"/>
      <text x="260" y="681" font-size="14" text-anchor="middle">Peer transport · RDMA / gRPC</text>
      <rect x="110" y="718" width="140" height="46" rx="5" fill="#EEEEEE" stroke="#879196"/>
      <text x="180" y="747" font-size="14" text-anchor="middle">NVMe (RAID0)</text>
      <rect x="270" y="718" width="140" height="46" rx="5" fill="#F1EAFF" stroke="#8C4FFF" stroke-width="1.5"/>
      <text x="340" y="747" font-size="14" text-anchor="middle">EFA NICs</text>
    </g>

    <!-- Peer plane band -->
    <line x1="340" y1="764" x2="340" y2="812" stroke="#8C4FFF" stroke-width="4"/>
    <line x1="705" y1="764" x2="705" y2="812" stroke="#8C4FFF" stroke-width="4"/>
    <line x1="1070" y1="764" x2="1070" y2="812" stroke="#8C4FFF" stroke-width="4"/>
    <line x1="340" y1="812" x2="1070" y2="812" stroke="#8C4FFF" stroke-width="6" stroke-linecap="round"/>
    <text x="625" y="842" font-size="16" font-weight="bold" fill="#8C4FFF" text-anchor="middle">Peer plane: EFA RDMA one-sided WRITE for data · gRPC :9100 for control and TCP fallback</text>

    <!-- Right column -->
    <rect x="1220" y="170" width="330" height="95" rx="8" fill="#FFFFFF" stroke="#545B64" stroke-width="1.5"/>
    <text x="1385" y="203" font-size="16" font-weight="bold" text-anchor="middle">Kubernetes API</text>
    <text x="1385" y="228" font-size="14" text-anchor="middle" fill="#545B64">EndpointSlice = who is in the ring</text>
    <text x="1385" y="249" font-size="14" text-anchor="middle" fill="#545B64">(Ready daemons only)</text>

    <rect x="1220" y="285" width="330" height="95" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
    <text x="1385" y="318" font-size="16" font-weight="bold" text-anchor="middle">EKS Pod Identity → IAM role</text>
    <text x="1385" y="343" font-size="14" text-anchor="middle" fill="#545B64">The daemon signs S3 calls itself;</text>
    <text x="1385" y="364" font-size="14" text-anchor="middle" fill="#545B64">clients hold no AWS credentials</text>

    <rect x="1220" y="440" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.5"/>
    <text x="1385" y="476" font-size="15" font-weight="bold" text-anchor="middle">Gateway VPC endpoint (s3express / s3)</text>

    <rect x="1220" y="545" width="330" height="200" rx="10" fill="#EFF6E9" stroke="#3F8624" stroke-width="2"/>
    <text x="1385" y="583" font-size="19" font-weight="bold" text-anchor="middle" fill="#3F8624">Amazon S3</text>
    <text x="1385" y="612" font-size="16" text-anchor="middle">Express One Zone directory bucket</text>
    <text x="1385" y="634" font-size="14" text-anchor="middle" fill="#545B64">same AZ as the nodes (default)</text>
    <text x="1385" y="668" font-size="14" text-anchor="middle" fill="#545B64">or S3 Standard</text>
    <text x="1385" y="690" font-size="14" text-anchor="middle" fill="#545B64">(needed for write scatter)</text>
    <text x="1385" y="724" font-size="14" text-anchor="middle" font-style="italic">the source of truth</text>

    <!-- cluster to S3 -->
    <path d="M1190,470 L1218,470" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
    <path d="M1385,500 L1385,543" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
    <text x="1398" y="518" font-size="13" fill="#3F8624">misses: read once</text>
    <text x="1398" y="535" font-size="13" fill="#3F8624">writes: write-through</text>
  </g>
</svg>
