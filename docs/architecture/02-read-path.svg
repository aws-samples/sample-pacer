<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#147EBA"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C4FFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3F8624"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#232F3E">

    <text x="40" y="58" font-size="34" font-weight="bold">Read path: every 16 MiB chunk takes the cheapest source</text>
    <text x="40" y="92" font-size="18" fill="#545B64">Objects are cut into chunks. Each chunk is resolved on its own, so one GET can mix local, peer and S3 bytes.</text>

    <!-- Legend -->
    <g font-size="13">
      <line x1="1130" y1="45" x2="1170" y2="45" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/><text x="1178" y="50">HTTP (S3 API)</text>
      <line x1="1300" y1="45" x2="1340" y2="45" stroke="#147EBA" stroke-width="2" marker-end="url(#aB)"/><text x="1348" y="50">gRPC control</text>
      <line x1="1130" y1="75" x2="1170" y2="75" stroke="#8C4FFF" stroke-width="6" marker-end="url(#aP)"/><text x="1178" y="80">EFA RDMA data</text>
      <line x1="1300" y1="75" x2="1340" y2="75" stroke="#3F8624" stroke-width="2" marker-end="url(#aG)"/><text x="1348" y="80">Amazon S3</text>
    </g>

    <!-- Lane headers -->
    <rect x="60" y="115" width="200" height="64" rx="6" fill="#E6F2F8" stroke="#147EBA" stroke-width="1.5"/>
    <text x="160" y="143" font-size="16" font-weight="bold" text-anchor="middle">Client pod</text>
    <text x="160" y="165" font-size="13" text-anchor="middle" fill="#545B64">on node A</text>
    <rect x="360" y="115" width="220" height="64" rx="6" fill="#FFF4E5" stroke="#ED7100" stroke-width="2"/>
    <text x="470" y="143" font-size="16" font-weight="bold" text-anchor="middle">pacer-daemon, node A</text>
    <text x="470" y="165" font-size="13" text-anchor="middle" fill="#545B64">the reader</text>
    <rect x="890" y="115" width="240" height="64" rx="6" fill="#FFF4E5" stroke="#ED7100" stroke-width="2"/>
    <text x="1010" y="143" font-size="16" font-weight="bold" text-anchor="middle">pacer-daemon, node B</text>
    <text x="1010" y="165" font-size="13" text-anchor="middle" fill="#545B64">the chunk's home (picked by hash ring)</text>
    <rect x="1330" y="115" width="200" height="64" rx="6" fill="#EFF6E9" stroke="#3F8624" stroke-width="2"/>
    <text x="1430" y="143" font-size="16" font-weight="bold" text-anchor="middle" fill="#3F8624">Amazon S3</text>
    <text x="1430" y="165" font-size="13" text-anchor="middle" fill="#545B64">Express or Standard</text>

    <!-- Lifelines -->
    <g stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="160" y1="179" x2="160" y2="835"/>
      <line x1="470" y1="179" x2="470" y2="835"/>
      <line x1="1010" y1="179" x2="1010" y2="835"/>
      <line x1="1430" y1="179" x2="1430" y2="835"/>
    </g>

    <!-- ===== Case 1: local hit ===== -->
    <rect x="30" y="195" width="1540" height="130" rx="8" fill="#F2F2F2" fill-opacity="0.55" stroke="#DDDDDD"/>
    <text x="45" y="220" font-size="17" font-weight="bold">1 · Local hit</text>
    <text x="45" y="241" font-size="14" fill="#545B64">on this node</text>
    <rect x="410" y="232" width="120" height="78" rx="5" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <text x="470" y="266" font-size="14" text-anchor="middle">RAM slab</text>
    <text x="470" y="286" font-size="14" text-anchor="middle">or NVMe</text>
    <line x1="160" y1="252" x2="408" y2="252" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="245" font-size="13" text-anchor="middle">GET bucket/key</text>
    <line x1="410" y1="296" x2="162" y2="296" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="289" font-size="13" text-anchor="middle">bytes</text>
    <text x="560" y="268" font-size="15" fill="#545B64">No network hop: the bytes come from this node.</text>

    <!-- ===== Case 2: peer hit ===== -->
    <rect x="30" y="337" width="1540" height="208" rx="8" fill="#F2F2F2" fill-opacity="0.55" stroke="#DDDDDD"/>
    <text x="45" y="362" font-size="17" font-weight="bold">2 · Peer hit</text>
    <text x="45" y="383" font-size="14" fill="#545B64">another node holds it</text>
    <rect x="410" y="372" width="120" height="160" rx="5" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <text x="470" y="395" font-size="12" text-anchor="middle" fill="#545B64">registered</text>
    <text x="470" y="410" font-size="12" text-anchor="middle" fill="#545B64">buffer</text>
    <rect x="950" y="372" width="120" height="160" rx="5" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <text x="1010" y="445" font-size="14" text-anchor="middle">RAM slab</text>
    <text x="1010" y="465" font-size="14" text-anchor="middle">or NVMe</text>

    <line x1="160" y1="405" x2="408" y2="405" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="398" font-size="13" text-anchor="middle">GET bucket/key</text>
    <line x1="530" y1="418" x2="948" y2="418" stroke="#147EBA" stroke-width="2" marker-end="url(#aB)"/>
    <text x="740" y="411" font-size="13" text-anchor="middle" fill="#147EBA">a · FetchBlob: chunk key + "write it here" (buffer address, key)</text>
    <line x1="950" y1="458" x2="540" y2="458" stroke="#8C4FFF" stroke-width="8" marker-end="url(#aP)"/>
    <text x="740" y="447" font-size="14" font-weight="bold" text-anchor="middle" fill="#8C4FFF">b · RDMA WRITE straight from the holder's cache</text>
    <text x="740" y="484" font-size="13" text-anchor="middle" fill="#8C4FFF">NIC to NIC, no copy, holder CPU barely involved</text>
    <line x1="950" y1="500" x2="532" y2="500" stroke="#147EBA" stroke-width="2" marker-end="url(#aB)"/>
    <text x="740" y="518" font-size="13" text-anchor="middle" fill="#147EBA">c · reply = "done" + checksum</text>
    <line x1="410" y1="520" x2="162" y2="520" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="513" font-size="13" text-anchor="middle">bytes</text>
    <text x="1090" y="425" font-size="14" fill="#545B64">No EFA on a node, or any RDMA</text>
    <text x="1090" y="445" font-size="14" fill="#545B64">error: the same fetch streams</text>
    <text x="1090" y="465" font-size="14" fill="#545B64">over gRPC/TCP instead.</text>

    <!-- ===== Case 3: cold ===== -->
    <rect x="30" y="557" width="1540" height="262" rx="8" fill="#F2F2F2" fill-opacity="0.55" stroke="#DDDDDD"/>
    <text x="45" y="582" font-size="17" font-weight="bold">3 · Cold</text>
    <text x="45" y="603" font-size="14" fill="#545B64">nobody holds it</text>
    <rect x="410" y="592" width="120" height="212" rx="5" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect x="950" y="592" width="120" height="212" rx="5" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <text x="1010" y="735" font-size="13" text-anchor="middle" fill="#ED7100" font-weight="bold">fills its</text>
    <text x="1010" y="752" font-size="13" text-anchor="middle" fill="#ED7100" font-weight="bold">cache</text>

    <line x1="160" y1="625" x2="408" y2="625" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="618" font-size="13" text-anchor="middle">GET bucket/key</text>
    <line x1="530" y1="640" x2="948" y2="640" stroke="#147EBA" stroke-width="2" marker-end="url(#aB)"/>
    <text x="740" y="633" font-size="13" text-anchor="middle" fill="#147EBA">a · FetchBlob</text>
    <line x1="1070" y1="660" x2="1428" y2="660" stroke="#3F8624" stroke-width="2.5" marker-end="url(#aG)"/>
    <text x="1250" y="653" font-size="13" text-anchor="middle" fill="#3F8624">b · ranged GET, one 16 MiB chunk</text>
    <line x1="1430" y1="700" x2="1072" y2="700" stroke="#3F8624" stroke-width="2.5" marker-end="url(#aG)"/>
    <text x="1250" y="693" font-size="13" text-anchor="middle" fill="#3F8624">bytes</text>
    <line x1="950" y1="745" x2="540" y2="745" stroke="#8C4FFF" stroke-width="8" marker-end="url(#aP)"/>
    <text x="740" y="734" font-size="14" font-weight="bold" text-anchor="middle" fill="#8C4FFF">c · RDMA WRITE + reply, as in case 2</text>
    <line x1="410" y1="785" x2="162" y2="785" stroke="#232F3E" stroke-width="2" marker-end="url(#aK)"/>
    <text x="284" y="778" font-size="13" text-anchor="middle">bytes</text>
    <text x="1090" y="742" font-size="14" fill="#545B64">The home is the only node that reads</text>
    <text x="1090" y="762" font-size="14" fill="#545B64">S3 for this chunk: readers arriving at</text>
    <text x="1090" y="782" font-size="14" fill="#545B64">once share one GET. The next read is case 2.</text>

    <!-- Footer -->
    <text x="40" y="862" font-size="15" fill="#232F3E"><tspan font-weight="bold">Never client-visible:</tspan> any peer failure makes the reader read S3 itself. <tspan font-weight="bold">Hot chunks</tspan> are also kept by the readers that keep asking, and each chunk has two homes by default.</text>
  </g>
</svg>
